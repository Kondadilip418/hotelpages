<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="brand">
            Grand Place Hotel
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="rooms.html">Rooms</a>
            <a href="booking.html">Booking</a>
        </nav>
    </header>
    <main class="container">
        <h2>Book Your Stay</h2>
        <form action="" class="booking-form">
            <label>Name</label>
            <input type="text" name="" id="" placeholder="Your name... " required>

            <label>Email</label>
            <input type="email" name="" id="" placeholder="Your email..." required>

            <label>
                Room Type
            </label>
            <select name="" id="" required>
                <option value="del">Deluxe Room</option>
                <option value="exe">executive Room</option>
                <option value="stand">Standard Room</option>
                <option value="que">Queen Room</option>>
                <option value="kin">King Room</option>
                <option value="sing">Single Room</option>
                <option value="doub">Double Room</option>
            </select>
            <label>Chek-In-Date</label>
            <input type="date" required>

            <label>Check-Out-Date</label>
            <input type="date" required>

            <button typ="submit">Book Now</button>
        </form>
    </main>
    <footer>
        &copy; 2026 Grand hotel all rights reserved.
    </footer>
</body>
</html>
